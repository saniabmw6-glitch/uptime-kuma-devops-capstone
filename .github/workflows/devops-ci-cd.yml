
name: Uptime Kuma DevOps CI-CD

on:
  push:
    branches:
      - devops/uptime-kuma-2.5.11
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          target: rootless
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/uptime-kuma-devops-capstone:2.5.11
            ghcr.io/${{ github.repository_owner }}/uptime-kuma-devops-capstone:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Uptime Kuma DevOps Capstone
          cache-from: type=gha
          cache-to: type=gha,mode=max
